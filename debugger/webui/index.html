<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Debug Monitor</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <div id="toolbar">
            <input id="search" placeholder="Search...">

            <select id="typeFilter" aria-label="Filter by type">
                <option value="">All</option>
                <option value="float">Float</option>
                <option value="int">Int</option>
                <option value="bool">Bool</option>
            </select>

            <span id="count"></span>
            <span id="status"></span>
            <input id="webport" type="number" value="8080" placeholder="8080" min="1" max="65535" />
        </div>
    </header>

    <table>
        <thead>
            <tr>
                <th>★</th>
                <th>Name</th>
                <th>Value</th>
                <th>Type</th>
            </tr>
        </thead>

        <tbody id="tbody"></tbody>
    </table>

    <script>
        window.DEBUG_UI_HOSTS = [
            window.location.origin && window.location.origin !== "null" ? window.location.origin : null
        ].filter(Boolean);
    </script>
    <script src="app2.js" defer></script>

</body>
</html>
